<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07-class-vehicle</title>
    <link rel="stylesheet" href="../src/css/04-js.css">
    <style>
        div.vehicle {
            background-color: #fbfcfc;
            border-radius: 8px;
            margin: 0 auto;
            height: 576px;
            padding: 12px;
            width: 356px;

            /* --- MODO CLARO --- */
            header {
                align-items: center;
                display: flex;
                justify-content: space-between;

                figure.logo {
                    background: url(imgs/vehicle/logo_light.png) no-repeat center /cover;
                    height: 80px;
                    margin: 0;
                    width: 220px;
                }

                button.mode {
                    background: url(imgs/vehicle/mode-light.svg) no-repeat center /cover;
                    border: none;
                    cursor: pointer;
                    height: 70px;
                    transition: transform 0.4s ease-in;
                    width: 100px;

                    &:hover {
                        transform: scale(1.1);
                    }
                }
            }

            nav {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-top: 20px;

                figure.brand {
                    background: url(imgs/vehicle/brand_light.svg) no-repeat center /contain;
                    color: #141516;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 30px;
                    width: 200px;
                    margin: 0;
                }

                button {
                    border: none;
                    cursor: pointer;
                    height: 60px;
                    transition: transform 0.4s ease-in;
                    width: 80px;

                    &.prev {
                        background: url(imgs/vehicle/prev_light.svg) no-repeat center /contain;

                        &:hover {
                            transform: scale(1.2);
                        }
                    }

                    &.next {
                        background: url(imgs/vehicle/next_light.svg) no-repeat center /contain;

                        &:hover {
                            cursor: pointer;
                            transform: scale(1.2);
                        }
                    }
                }
            }

            div {
                align-items: center;
                display: flex;
                justify-content: space-between;
                margin-top: 20px;

                figure {
                    margin: 0;
                    padding: 0;
                    display: flex;
                    justify-content: center;
                    align-items: end;
                    padding-bottom: 10px;
                    height: 90px;
                    width: 110px;
                    color: #141516;

                    &.model {
                        background: url(imgs/vehicle/model_light.svg) no-repeat center /contain;
                    }

                    &.reference {
                        background: url(imgs/vehicle/reference_light.svg) no-repeat center /contain;
                    }

                    &.color {
                        background: url(imgs/vehicle/color_light.svg) no-repeat center /contain;
                    }
                }
            }

            figure.landscape {
                background: url(imgs/vehicle/landscape_light.svg) no-repeat center /cover;
                margin: 0;
                margin-top: 12px;
                height: 206px;
                width: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow: hidden;
                border-radius: 0.4rem;

                div.frame {
                    position: absolute;
                    left: 0;
                    top: 0;
                    width: 100%;
                    height: 100%;

                    div.layer {
                        position: absolute;
                        left: 0;
                        width: 695px;
                    }

                    div.sky {
                        background: url(imgs/vehicle/sky_light.png) repeat-x 0 bottom /contain;
                        top: 0;
                        height: 55%;
                        z-index: 1;
                    }

                    div.mountains {
                        background: url(imgs/vehicle/mountains_light.png) repeat-x 0 bottom /contain;
                        top: 22%;
                        height: 55%;
                        z-index: 2;
                    }

                    div.route {
                        background: url(imgs/vehicle/route_light.png) repeat-x 0 bottom /contain;
                        bottom: 0;
                        height: 28%;
                        z-index: 3;
                    }

                    img.moto {
                        position: absolute;
                        height: 120px;
                        width: auto;
                        transition: all 0.3s ease;
                        border: none !important;
                        border-radius: 0 !important;
                        left: 50%;
                        bottom: 10px;
                        transform: translateX(-50%);
                        z-index: 9;
                    }
                }
            }

            menu {
                align-items: center;
                display: flex;
                flex-direction: row;
                margin: 0;
                margin-top: 12px;
                padding: 0;
                justify-content: space-between;
                width: 356px;

                button {
                    border: none;
                    height: 68px;
                    width: 68px;
                    transition: transform 0.4s ease-in;

                    &.btn-on {
                        background: url(imgs/vehicle/btn-on_light.svg) no-repeat center /contain;
                    }

                    &.btn-forward {
                        background: url(imgs/vehicle/btn-forward_light.svg) no-repeat center /contain;
                    }

                    &.btn-stop {
                        background: url(imgs/vehicle/btn-stop_light.svg) no-repeat center /contain;
                    }

                    &.btn-backward {
                        background: url(imgs/vehicle/btn-backward_light.svg) no-repeat center /contain;
                    }

                    &.btn-off {
                        background: url(imgs/vehicle/btn-off_light.svg) no-repeat center /contain;
                    }

                    &:hover {
                        cursor: pointer;
                        transform: scale(1.2);
                    }
                }
            }

            /* --- MODO OSCURO --- */
            &.dark {
                background-color: #13171A;

                header {
                    figure.logo {
                        background: url(imgs/vehicle/logo_dark.png) no-repeat center /cover;
                    }

                    button.mode {
                        background: url(imgs/vehicle/mode-dark.svg) no-repeat center /cover;
                        width: 105px;

                        &:hover {
                            transform: scale(1.1);
                        }
                    }
                }

                nav {
                    figure.brand {
                        background: url(imgs/vehicle/brand_dark.svg) no-repeat center /contain;
                        color: #fff;
                    }

                    button {
                        &.prev {
                            background: url(imgs/vehicle/prev_dark.svg) no-repeat center /contain;

                            &:hover {
                                transform: scale(1.2);
                            }
                        }

                        &.next {
                            background: url(imgs/vehicle/next_dark.svg) no-repeat center /contain;

                            &:hover {
                                cursor: pointer;
                                transform: scale(1.2);
                            }
                        }
                    }
                }

                div {
                    figure {
                        color: #fff;

                        &.model {
                            background: url(imgs/vehicle/model_dark.svg) no-repeat center /contain;
                        }

                        &.reference {
                            background: url(imgs/vehicle/reference_dark.svg) no-repeat center /contain;
                        }

                        &.color {
                            background: url(imgs/vehicle/color_dark.svg) no-repeat center /contain;
                        }
                    }
                }

                figure.landscape {
                    background: url(imgs/vehicle/landscape_dark.png) no-repeat center /cover;

                    div.frame {
                        div.sky {
                            background: url(imgs/vehicle/sky_dark.png) repeat-x 0 bottom /contain;
                            
                        }

                        div.mountains {
                            background: url(imgs/vehicle/mountains_dark.png) repeat-x 0 bottom /contain;
                        }

                        div.route {
                            background: url(imgs/vehicle/route_dark.png) repeat-x 0 bottom /contain;
                        }
                    }
                }

                menu {
                    button {
                        &.btn-on {
                            background: url(imgs/vehicle/btn-on.svg) no-repeat center /contain;
                        }

                        &.btn-forward {
                            background: url(imgs/vehicle/btn-forward.svg) no-repeat center /contain;
                        }

                        &.btn-stop {
                            background: url(imgs/vehicle/btn-stop.svg) no-repeat center /contain;
                        }

                        &.btn-backward {
                            background: url(imgs/vehicle/btn-backward.svg) no-repeat center /contain;
                        }

                        &.btn-off {
                            background: url(imgs/vehicle/btn-off.svg) no-repeat center /contain;
                        }
                    }
                }
            }
        }
    </style>
</head>

<body>
    <a class="btn-home" href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg> </a>
    <main>
        <header>
            <h1>07 - Class Vehicle</h1>
            <h2>Create and manipulate a vehicle object with properties.</h2>
        </header>
        <section>
            <div class="recuadro">
                <div class="vehicle">
                    <header>
                        <figure class="logo"></figure>
                        <button class="mode"></button>
                    </header>
                    <nav>
                        <button class="prev"></button>
                        <figure class="brand"></figure>
                        <button class="next"></button>
                    </nav>
                    
                    <div>
                        <figure class="model"></figure>
                        <figure class="reference"></figure>
                        <figure class="color"></figure>
                    </div>

                    <figure class="landscape">
                        <div class="frame">
                            <div class="layer sky"></div>
                            <div class="layer mountains"></div>
                            <div class="layer route"></div>
                            <img class="moto" src="" alt="Moto">
                        </div>
                    </figure>

                    <menu>
                        <button class="btn-on"></button>
                        <button class="btn-forward"></button>
                        <button class="btn-stop"></button>
                        <button class="btn-backward"></button>
                        <button class="btn-off"></button>
                    </menu>
                </div>
            </div>
        </section>
    </main>
    <script>

        // Elements
        const vhc = document.querySelector('.vehicle');
        const mode = document.querySelector('.mode');
        const layers  = document.querySelectorAll('.layer');

        // Labels (Attributes)
        const lbrand = document.querySelector('.brand');
        const lmodel = document.querySelector('.model');
        const lrefer = document.querySelector('.reference');
        const lcolor = document.querySelector('.color');
        const lmoto  = document.querySelector('.moto');

        // Buttons
        const bnext = document.querySelector('.next');
        const bprev = document.querySelector('.prev');

        // ---
        const btnOn   = document.querySelector('.btn-on');
        const btnForw = document.querySelector('.btn-forward');
        const btnStop = document.querySelector('.btn-stop');
        const btnBack = document.querySelector('.btn-backward');
        const btnOff  = document.querySelector('.btn-off');

        // Variables
        let index = 0;

        // Object
        const vehicles = {
            attrs: [
                { brand: 'Suzuki',    refer: 'DR 150',  model: '2024', color: 'White',      image: 'imgs/vehicle/moto01.png' },
                { brand: 'Honda',     refer: 'XR650L',  model: '2024', color: 'Red',        image: 'imgs/vehicle/moto02.png' },
                { brand: 'KTM',       refer: 'EXC-F',   model: '2025', color: 'Green',      image: 'imgs/vehicle/moto03.png' },
                { brand: 'Husqvarna', refer: 'FE 350s', model: '2026', color: 'Light Blue', image: 'imgs/vehicle/moto04.png' },
                { brand: 'Yamaha',    refer: 'WR250F',  model: '2026', color: 'Blue',       image: 'imgs/vehicle/moto05.png' }
            ]
        };

        // Class
        class Vehicle {
            constructor(brand, refer, model, color, image) {
                this.brand = brand;
                this.refer = refer;
                this.model = model;
                this.color = color;
                this.image = image;
                this.isOn  = false;
                this.isPaused      = true;
                this.isReversed    = false;
                this.lastTimestamp = 0;
                this.displayData();

                // Botón para bloquear "prev" cuando cargue la página
                this.disabledButton(bprev);
            }

            disabledButton(btn) {
                btn.style.pointerEvents = 'none';
                btn.style.opacity = 0.2;
            }

            enabledButton(btn) {
                btn.style.pointerEvents = 'all';
                btn.style.opacity = '1';
            }

            displayData() {
                lbrand.textContent = this.brand;
                lmodel.textContent = this.model;
                lrefer.textContent = this.refer;
                lcolor.textContent = this.color;
                lmoto.setAttribute('src', this.image);

                console.table(vehicles.attrs);
            }

            powerOn() {
                if (!this.isOn) {
                    this.isOn = true
                    requestAnimationFrame(vibrate);
                }
            }

            powerOff() {
                if (this.isOn && this.isPaused) {
                    this.isOn = false;
                    requestAnimationFrame(vibrate);
                    lmoto.style.transform = 'translateX(-50%) translateY(0px)';
                }
            }

            forward() {
                if(this.isOn && this.isPaused) {
                    this.lastTimestamp = 0;
                    this.isPaused      = false;
                    this.isReversed    = false;
                    requestAnimationFrame(animateParallax);
                }
            }

            backward() {
                if(this.isOn && this.isPaused) {
                    this.lastTimestamp = 0;
                    this.isReversed    = true;
                    this.isPaused      = false;
                    requestAnimationFrame(animateParallax);
                }
            }

            stop() {
                if(this.isOn && !this.isPaused) {
                    this.lastTimestamp = 0;
                    this.isPaused = true;
                }
            }
        }

        moto = new Vehicle(vehicles.attrs[index].brand,
            vehicles.attrs[index].refer,
            vehicles.attrs[index].model,
            vehicles.attrs[index].color,
            vehicles.attrs[index].image);

        // Detect dark mode
        const darkMode = window.matchMedia('(prefers-color-scheme: dark)');
        const updateTheme = (e) => vhc.classList.toggle('dark', e.matches);
        updateTheme(darkMode);

        // Events
        darkMode.addEventListener('change', updateTheme);
        mode.addEventListener('click', function () {
            vhc.classList.toggle('dark');
        });

        bnext.addEventListener('click', function () {
            if (index < (vehicles.attrs.length) - 1) {
                moto.brand = vehicles.attrs[++index].brand;
                moto.model = vehicles.attrs[index].model;
                moto.refer = vehicles.attrs[index].refer;
                moto.color = vehicles.attrs[index].color;
                moto.image = vehicles.attrs[index].image;
                moto.displayData();
                moto.enabledButton(bprev)

                if (index == (vehicles.attrs.length)-1) {
                    moto.disabledButton(bnext);
                }
            }
            moto.displayData();
        });

        bprev.addEventListener('click', function () {
            if (index > 0) {
                moto.brand = vehicles.attrs[--index].brand;
                moto.model = vehicles.attrs[index].model;
                moto.refer = vehicles.attrs[index].refer;
                moto.color = vehicles.attrs[index].color;
                moto.image = vehicles.attrs[index].image
                moto.displayData();
                moto.enabledButton(bnext);

                if (index == 0) {
                    moto.disabledButton(bprev);
                }
            }
            moto.displayData();
        });

        btnOn.addEventListener('click', function () {
            moto.powerOn();
        });

        btnForw.addEventListener('click', function () {
            moto.forward();
        });

        btnStop.addEventListener('click', function () {
            moto.stop();
        });

        btnBack.addEventListener('click', function () {
            moto.backward();
        });

        btnOff.addEventListener('click', function () {
            moto.powerOff();
        });

        function vibrate() {
            if (!moto.isOn) return;
            lmoto.style.transform = `translateX(-50%) translateY(${1 * Math.sin(Date.now() / 25)}px)`;
            requestAnimationFrame(vibrate);
        }

        // Function Animate Parallax
        const speedFactors  = [0.04, 0.08, 0.25]
        layers.forEach(layer => {
            layer.dataset.pos = '0'
        })

        function animateParallax(timestamp) {
            if (!moto.isPaused) {
                const delta   = timestamp - (moto.lastTimestamp || timestamp)
                moto.lastTimestamp = timestamp

                layers.forEach((layer, index) => {
                let currentPos = (parseFloat(layer.dataset.pos) || 0) 
                                 + speedFactors[index] 
                                 * (moto.isReversed ? delta : -delta)
                layer.style.backgroundPositionX = `${currentPos}px`
                layer.dataset.pos = currentPos
                })
            }
            requestAnimationFrame(animateParallax)
        }
    </script>
</body>

</html>
